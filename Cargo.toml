[workspace]
members = ["fluent", "fluent-ipc", "fluent-aggregator", "fluent-status"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
input-event-codes = "6.2.0"
libc = "0.2.186"
pest = "2.9.2"
pest_derive = "2.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_plain = "1.0.0"
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
clap = { version = "4.6.7", features = ["derive"] }
