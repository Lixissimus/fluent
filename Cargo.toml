[workspace]
members = ["fluent-ipc"]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.102"
input-event-codes = "6.2.0"
libc = "0.2.186"
pest = "2.8.3"
pest_derive = "2.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_plain = "1.0.0"
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[package]
name = "fluent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
input-event-codes = { workspace = true }
serde = { workspace = true }
serde_plain = { workspace = true }
pest = { workspace = true }
pest_derive = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
